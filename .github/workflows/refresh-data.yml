name: Refresh club data

# Rebuilds the stats from the Google Sheet (plus album genres from
# Deezer/iTunes) and stores them in Workers KV,
# where the Worker serves them from. Runs every 30 minutes, after changes to
# the stats code or KV config land on main, and on demand (Actions tab > Run workflow).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "wrangler.jsonc", ".github/workflows/refresh-data.yml"]

concurrency:
  group: refresh-club-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The last build's album genres are reused, so only new albums are
      # looked up on Deezer/iTunes. If this fails, every album is looked up
      # (about 1.5 minutes).
      - name: Fetch the previous build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.169.0 kv key get club-data --binding CLUB_DATA --remote --text > previous.json || true

      - name: Build club-data.json
        env:
          SHEETS_DOC_ID: ${{ secrets.SHEETS_DOC_ID }}
          SHEETS_GID: ${{ secrets.SHEETS_GID }}
        run: python pipeline/build_data.py --out club-data.json --previous previous.json

      - name: Write to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.169.0 kv key put club-data --path club-data.json --binding CLUB_DATA --remote
